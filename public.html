<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16402a">
<title>خريطة الأكشاك المتوفرة للحجز — Basra Christmas Market</title>
<meta name="description" content="خريطة تفاعلية تعرض الأكشاك المتوفرة للحجز في Basra Christmas Market">
<meta property="og:title" content="Basra Christmas Market — خريطة الأكشاك المتوفرة للحجز">
<meta property="og:description" content="اختر كشكك من الخريطة وتواصل مع الإدارة للحجز">
<meta property="og:image" content="img/og.jpg">
<link rel="icon" href="img/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&family=Reem+Kufi:wght@500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/festive.css">
<style>
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; background:
    radial-gradient(800px 380px at 85% -10%, rgba(179,33,42,.55), transparent 70%),
    radial-gradient(circle at 12% 30%, rgba(255,214,120,.3) 0 2px, transparent 3px),
    radial-gradient(circle at 46% 18%, rgba(255,255,255,.25) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 70% 52%, rgba(255,214,120,.25) 0 2px, transparent 3px),
    linear-gradient(180deg, #0f2e1d, #16402a 70%, #1b4a30); }
  .pub-top { color: #fff; padding: 12px 18px 14px; display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 6; }
  .pub-logo { height: clamp(58px, 11vw, 92px); width: auto; display: block; filter: drop-shadow(0 6px 14px rgba(0,0,0,.35)); cursor: pointer; transition: transform .3s; }
  .pub-logo:hover { transform: rotate(-3deg) scale(1.04); }
  .pub-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .pub-head .fx-count { margin-inline-start: auto; }
  .pub-head .fx-cell { min-width: 52px; padding: 6px 4px 4px; }
  .pub-head .fx-cell b { font-size: 20px; }
  .pub-head .fx-count-h { font-size: 15px; }
  .pub-tools { display: flex; gap: 6px; margin-inline-start: 8px; }
  .pub-tools .btn, .pub-tools .fx-toggle { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.3); }
  @media (max-width: 700px) {
    .pub-top { padding: 8px 12px 12px; gap: 8px; }
    .pub-head { gap: 8px 10px; }
    .pub-logo { height: 46px; }
    .pub-title h1 { font-size: 17px; } .pub-title p { font-size: 14px; }
    .pub-tools { order: 2; margin-inline-start: auto; } .pub-tools .btn, .pub-tools .fx-toggle { padding: 4px 9px; min-height: 30px; font-size: 12px; }
    .pub-head .fx-count { order: 3; margin-inline-start: 0; width: 100%; flex-direction: row; align-items: center; justify-content: space-between; gap: 6px; }
    .pub-head .fx-count-h { font-size: 13px; }
    .pub-head .fx-cell { min-width: 42px; padding: 3px 2px 2px; border-radius: 10px; } .pub-head .fx-cell b { font-size: 15px; } .pub-head .fx-cell small { font-size: 9.5px; }
    .pub-ctl .in[type=date] { flex: 1 1 38%; min-width: 0; }
  }
  .pub-title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .pub-title h1 { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 4vw, 28px); margin: 0; line-height: 1.15; }
  .pub-title p { margin: 0; color: var(--gold-2); font-family: var(--display); font-size: clamp(16px, 3vw, 20px); }
  .pub-ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pub-ctl .in { width: auto; min-height: 38px; background: #fff; }
  .pub-ctl .in[type=search] { flex: 1 1 160px; max-width: 220px; }
  .pub-ctl .hint, .pub-ctl label { color: #c7d6cd; font-size: 13px; }
  .pub-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #e2ebe5; }
  .pub-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; border: 1px solid rgba(255,255,255,.4); }
  .pub-legend b { color: #fff; }
  .mapbox { flex: 1; border-radius: 26px 26px 0 0; margin: 0 8px; box-shadow: 0 -2px 0 4px rgba(255,255,255,.9), 0 -10px 40px rgba(0,0,0,.25); position: relative; }
  .pub-top .fx-garland { top: auto; bottom: -30px; }
  .sheet { position: fixed; inset-inline: 12px; bottom: 12px; z-index: 45; background: #fff; border-radius: 22px; overflow: hidden; padding-top: 24px !important; box-shadow: 0 10px 40px rgba(0,0,0,.25); padding: 18px; display: flex; flex-direction: column; gap: 10px; max-width: 460px; margin-inline: auto; animation: up .18s ease-out; }
  @keyframes up { from { transform: translateY(12px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .sheet::before { content: ""; position: absolute; inset-inline: 0; top: 0; height: 7px; background: var(--candy-g); }
  .sheet .code { font-family: var(--display); font-size: 44px; line-height: 1; color: var(--wine); }
  .sheet .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sheet p { margin: 0; }
  .sheet .msg { font-size: 17px; font-weight: 600; }
  .sheet .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .sheet .acts .btn { flex: 1; min-height: 46px; }
  .contacts { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
  .contact { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
  .contact .who { display: flex; flex-direction: column; line-height: 1.3; }
  .contact .who span { color: var(--ink-3); font-size: 13px; }
  .contact .btn { min-height: 38px; padding: 0 14px; }
  .closed { color: #fff; text-align: center; margin: auto; padding: 30px; }
  .credit { position: absolute; bottom: 10px; inset-inline-start: 12px; font-size: 11px; color: var(--ink-3); background: rgba(255,255,255,.8); padding: 2px 8px; border-radius: 6px; z-index: 2; }
</style>
</head>
<body>
  <header class="pub-top">
    <div class="pub-head"><img class="pub-logo" id="pub-logo" src="img/logo-dark.svg" alt="Market Christmas — Santa's Factory">
      <div class="pub-title" style="flex-direction:column;gap:2px;align-items:flex-start"><h1 id="t-name">Basra Christmas Market</h1><p>خريطة الأكشاك المتوفرة للحجز</p></div>
      <div id="count-host" style="display:contents"></div>
      <div class="pub-tools" id="pub-tools"><button id="lang-toggle" class="btn small" type="button">English</button></div></div>
    <div class="pub-ctl">
      <label for="from">من</label><input id="from" class="in" type="date">
      <label for="to">إلى</label><input id="to" class="in" type="date">
      <button id="all" class="btn small" type="button">كل أيام المهرجان</button>
      <input id="q" class="in" type="search" placeholder="رقم الكشك، مثل A1" aria-label="ابحث عن كشك">
    </div>
    <div class="pub-legend" id="legend"></div>
  </header>
  <div class="mapbox" id="map"><div class="credit" id="updated"></div></div>
  <div id="sheet-host"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script type="module" src="js/public.js"></script>
</body>
</html>
