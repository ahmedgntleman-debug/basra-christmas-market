<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16402a">
<title>إدارة الأكشاك — Basra Christmas Market</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&family=Reem+Kufi:wght@500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/festive.css">
</head>
<body>
<div id="login" hidden>
  <div class="login-card">
    <h1 class="brand kufi"><img src="img/logo.svg" alt="Market Christmas — Santa's Factory"><small>Basra Christmas Market — إدارة الأكشاك</small></h1>
    <form id="login-form" style="display:flex;flex-direction:column;gap:12px">
      <label class="f"><span>البريد الإلكتروني</span><input class="in" name="email" type="email" autocomplete="username" required dir="ltr"></label>
      <label class="f"><span>كلمة المرور</span><input class="in" name="password" type="password" autocomplete="current-password" required dir="ltr"></label>
      <button class="btn primary" type="submit">تسجيل الدخول</button>
    </form>
    <div id="login-msg" role="alert"></div>
    <button id="lang-toggle" class="btn small ghost" type="button" style="align-self:flex-start">English</button>
  </div>
</div>

<div id="app" hidden>
  <nav class="nav" aria-label="القائمة الرئيسية">
    <p class="brand"><img src="img/logo-dark.svg" alt="Market Christmas" id="nav-logo"><span>إدارة الأكشاك</span></p>
    <a href="#/"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</a>
    <a href="#/map"><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></svg>الخريطة</a>
    <a href="#/reservations"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>الحجوزات</a>
    <a href="#/customers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c1.8.7 3 2.5 3.5 5.4"/></svg>العملاء</a>
    <a href="#/reports"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>التقارير</a>
    <a href="#/settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>الإعدادات</a>
    <div class="foot"><span id="who"></span><button id="lang-toggle2" type="button">English</button><button id="logout" type="button">تسجيل الخروج</button></div>
  </nav>
  <div class="main">
    <header class="top">
      <h1 id="page-title">الرئيسية</h1>
      <select id="edition" class="in" aria-label="نسخة المهرجان"></select>
      <button id="assist" class="btn small pine" type="button" hidden>المساعد الذكي</button>
      <button class="btn small ghost mobile-out" type="button" onclick="document.getElementById('logout').click()">خروج</button>
    </header>
    <main id="view"></main>
  </div>
</div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/xlsx.min.js" defer></script>
<script type="module" src="js/admin.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
